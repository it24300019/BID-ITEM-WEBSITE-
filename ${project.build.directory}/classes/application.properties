spring.application.name=ebidpro-backend
# Server Configuration
server.port=8080

# Database Configuration for SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ebidpro_db;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# Security Configuration (disable default form login)
spring.security.user.name=admin
spring.security.user.password=admin123

# CORS Configuration
# Add this line instead:
server.servlet.context-path=/


# Logging Configuration
logging.level.com.ebidpro=DEBUG
logging.level.org.springframework.security=DEBUG
