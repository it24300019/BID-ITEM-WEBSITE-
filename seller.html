<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seller Dashboard</title>
    <style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
body{background:#0d1b2a;color:#fff;line-height:1.6;}
nav{background:#1b263b;display:flex;justify-content:space-between;align-items:center;padding:15px 30px;box-shadow:0 4px 8px rgba(0,0,0,0.5);}
nav .logo{font-size:1.5rem;color:#fca311;font-weight:bold;}
nav ul{list-style:none;display:flex;gap:20px;}
nav ul li a{color:#fff;text-decoration:none;font-weight:500;padding:6px 12px;border-radius:6px;transition:0.3s;}
nav ul li a:hover{background:#457b9d;transform:scale(1.05);}

.hero{background:linear-gradient(135deg,#1b263b,#415a77);color:#fff;padding:60px 20px;text-align:center;}
.hero h1{font-size:2.5rem;margin-bottom:10px;}
.hero p{font-size:1.2rem;}

.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding:30px;}
.item-card{background:#1b263b;border-radius:12px;overflow:hidden;box-shadow:0 4px 8px rgba(0,0,0,0.5);transition:transform 0.3s ease, box-shadow 0.3s ease;}
.item-card:hover{transform:translateY(-5px);box-shadow:0 6px 12px rgba(0,0,0,0.7);}
.item-card img{width:100%;height:180px;object-fit:cover;transition:transform 0.3s;}
.item-card img:hover{transform:scale(1.05);}
.item-card .content{padding:15px;}
.item-card h3{color:#a8dadc;margin-bottom:5px;}
.item-card p{color:#e0e0e0;font-size:0.9rem;margin-bottom:10px;}
.price{color:#fca311;font-weight:bold;}
.discount{color:#e63946;font-weight:bold;margin-left:10px;}
.btn{display:inline-block;padding:8px 16px;border-radius:25px;border:none;cursor:pointer;transition:all 0.3s ease;text-decoration:none;font-size:0.9rem;margin-right:5px;}
.btn-primary{background:#457b9d;color:#fff;}
.btn-primary:hover{background:#1d3557;transform:scale(1.05);}
.btn-danger{background:#e63946;color:#fff;}
.btn-danger:hover{background:#c71c30;transform:scale(1.05);}

form{background:#1b263b;padding:25px;margin:20px auto;border-radius:12px;max-width:600px;box-shadow:0 4px 8px rgba(0,0,0,0.5);}
form h2{margin-bottom:15px;color:#fca311;}
form input, form textarea, form select{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #333;background:#0d1b2a;color:#fff;transition:border 0.3s;}
form input:focus, form textarea:focus, form select:focus{border:1px solid #457b9d;outline:none;}
</style>
</head>
<body>

<!-- Navbar -->
<nav>
    <div class="logo">BidZone</div>
    <ul>
        <li><a href="seller.html">Seller</a></li>
        <li><a href="bidder.html">Bidder</a></li>
        <li><a href="users.html">Users</a></li>
    </ul>
</nav>

<section class="hero">
    <h1>Seller Dashboard</h1>
    <p>Add, update, and delete your bid items!</p>
</section>

<section class="item-grid" id="itemGrid"></section>

<form id="itemForm">
    <h2>Add / Update Bid Item</h2>
    <input type="hidden" id="itemIndex">
    <input type="text" id="title" placeholder="Title" required>
    <textarea id="description" placeholder="Description"></textarea>
    <select id="category">
        <option value="">Select Category</option>
        <option>Electronics</option>
        <option>Fashion</option>
        <option>Home</option>
    </select>
    <input type="number" id="price" placeholder="Price" required>
    <input type="number" id="discount" placeholder="Discount (optional)">
    <input type="text" id="image" placeholder="Image URL" required>
    <button type="submit" class="btn btn-primary">Save Item</button>
</form>

<script>
let items = JSON.parse(localStorage.getItem('bidItems')) || [];

const form = document.getElementById('itemForm');
const itemGrid = document.getElementById('itemGrid');

function renderItems(){
  itemGrid.innerHTML = '';
  items.forEach((item,index)=>{
    const card = document.createElement('div');
    card.className='item-card';
    card.innerHTML=`
      <img src="${item.image}" alt="${item.title}">
      <div class="content">
        <h3>${item.title}</h3>
        <p>${item.description}</p>
        <span class="price">$${item.price}</span> <span class="discount">${item.discount ? '$'+item.discount+' off':''}</span><br><br>
        <button class="btn btn-primary" onclick="editItem(${index})">Edit</button>
        <button class="btn btn-danger" onclick="deleteItem(${index})">Delete</button>
      </div>
    `;
    itemGrid.appendChild(card);
  });
  localStorage.setItem('bidItems', JSON.stringify(items));
}

function editItem(index){
  const item = items[index];
  document.getElementById('itemIndex').value = index;
  document.getElementById('title').value = item.title;
  document.getElementById('description').value = item.description;
  document.getElementById('category').value = item.category;
  document.getElementById('price').value = item.price;
  document.getElementById('discount').value = item.discount || '';
  document.getElementById('image').value = item.image;
  window.scrollTo({top:0, behavior:'smooth'});
}

function deleteItem(index){
  if(confirm('Are you sure you want to delete this item?')){
    items.splice(index,1);
    renderItems();
  }
}

form.addEventListener('submit', function(e){
  e.preventDefault();
  const index = document.getElementById('itemIndex').value;
  const newItem = {
    title: document.getElementById('title').value,
    description: document.getElementById('description').value,
    category: document.getElementById('category').value,
    price: Number(document.getElementById('price').value),
    discount: Number(document.getElementById('discount').value) || 0,
    image: document.getElementById('image').value
  };
  if(index==='') items.push(newItem);
  else items[index] = newItem;

  form.reset();
  document.getElementById('itemIndex').value='';
  renderItems();
});

// Initial render
renderItems();
</script>
</body>
</html>
