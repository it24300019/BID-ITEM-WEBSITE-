<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Auction Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .form-container {
            background-color: #1e293b;
            border: 1px solid #334155;
        }
        .form-input {
            background-color: #334155;
            border: 1px solid #475569;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
        }
        .gradient-text {
            background: linear-gradient(to right, #3b82f6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .fade-in {
            animation: fadeInAnimation 1s ease-in-out;
        }
        @keyframes fadeInAnimation {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md p-8 space-y-8 rounded-2xl form-container shadow-2xl fade-in">
        <div class="text-center">
            <a href="index.html" class="text-3xl font-bold font-poppins gradient-text">Online Auction Hub</a>
            <h2 class="mt-2 text-2xl font-bold text-slate-100">Welcome Back!</h2>
            <p class="text-slate-400">Sign in to continue your journey.</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-6" novalidate>
            <div>
                <label for="email" class="text-sm font-medium text-slate-300">Email Address</label>
                <input id="email" name="email" type="email" autocomplete="email" required
                       class="w-full px-4 py-3 mt-2 text-white rounded-lg form-input"
                       placeholder="e.g., john.doe@example.com">
            </div>

            <div>
                <label for="password" class="text-sm font-medium text-slate-300">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required
                       class="w-full px-4 py-3 mt-2 text-white rounded-lg form-input"
                       placeholder="Enter your password">
            </div>
            
            <!-- Error Message Display -->
            <div id="loginError" class="text-red-400 text-sm hidden"></div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <label for="remember-me" class="ml-2 block text-sm text-slate-300">Remember me</label>
                </div>
                <div class="text-sm">
                    <a href="#" class="font-medium text-blue-400 hover:text-blue-300">Forgot your password?</a>
                </div>
            </div>

            <div>
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-300">
                    Sign In
                </button>
            </div>
        </form>

        <p class="text-sm text-center text-slate-400">
            Not a member?
            <a href="register.html" class="font-medium text-blue-400 hover:text-blue-300">
                Register now
            </a>
        </p>
    </div>

    <!-- Link to the main JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
