<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users - Bid Item Viewer</title>
    <style>
  /* General */
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background:#0d1b2a; color:#fff; line-height:1.6; }

  /* Navbar */
  nav {
    background:#1b263b; display:flex; justify-content:space-between; align-items:center; padding:15px 30px;
    box-shadow:0 4px 8px rgba(0,0,0,0.5);
  }
  nav .logo { font-size:1.5rem; color:#fca311; font-weight:bold; }
  nav ul { list-style:none; display:flex; gap:20px; }
  nav ul li a { color:#fff; text-decoration:none; font-weight:500; padding:6px 12px; border-radius:6px; transition:0.3s; }
  nav ul li a:hover { background:#457b9d; transform:scale(1.05); }

  /* Hero Section */
  .hero { background:linear-gradient(135deg,#1b263b,#415a77); color:#fff; padding:60px 20px; text-align:center; position:relative; overflow:hidden; }
  .hero h1 { font-size:2.5rem; margin-bottom:10px; animation: fadeInDown 1s ease; }
  .hero p { font-size:1.2rem; animation: fadeInUp 1.2s ease; }

  /* Category Tabs */
  .tabs { display:flex; justify-content:center; gap:20px; margin:20px 0; }
  .tab { cursor:pointer; padding:10px 20px; background:#1b263b; border-radius:10px; transition:0.3s; }
  .tab:hover, .tab.active { background:#457b9d; transform:scale(1.05); }

  /* Item Grid */
  .item-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; padding:0 30px 30px 30px; }
  .item-card { background:#1b263b; border-radius:12px; overflow:hidden; box-shadow:0 4px 8px rgba(0,0,0,0.5); transition:transform 0.3s ease, box-shadow 0.3s ease, opacity 0.6s ease; opacity:0; }
  .item-card.show { opacity:1; animation:fadeInUp 0.8s forwards; }
  .item-card img { width:100%; height:180px; object-fit:cover; cursor:pointer; transition:transform 0.3s; }
  .item-card img:hover { transform:scale(1.05); }
  .item-card .content { padding:15px; }
  .item-card h3 { color:#a8dadc; margin-bottom:5px; }
  .item-card p { color:#e0e0e0; font-size:0.9rem; margin-bottom:10px; }
  .price { color:#fca311; font-weight:bold; }
  .discount { color:#e63946; font-weight:bold; margin-left:10px; }

  /* Lightbox */
  .lightbox { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:1000; }
  .lightbox img { max-width:90%; max-height:80%; border-radius:12px; }

  /* Animations */
  @keyframes fadeInDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

<!-- Navbar -->
<nav>
    <div class="logo">BidZone</div>
    <ul>
        <li><a href="seller.html">Seller</a></li>
        <li><a href="bidder.html">Bidder</a></li>
        <li><a href="users.html">Users</a></li>
    </ul>
</nav>

<section class="hero">
    <h1>All Items</h1>
    <p>Browse items, prices, discounts, and categories!</p>
</section>

<!-- Category Tabs -->
<div class="tabs">
    <div class="tab active" data-category="All">All</div>
    <div class="tab" data-category="Electronics">Electronics</div>
    <div class="tab" data-category="Fashion">Fashion</div>
    <div class="tab" data-category="Home">Home</div>
</div>

<!-- Items -->
<section class="item-grid" id="itemGrid"></section>

<!-- Lightbox -->
<div class="lightbox" id="lightbox"><img src="" alt="Item"></div>

<script>
const items = [
  {title:"Smartphone", description:"Latest model with excellent camera", price:200, discount:20, category:"Electronics", image:"https://via.placeholder.com/300x180?text=Smartphone"},
  {title:"Laptop", description:"High performance laptop", price:450, discount:50, category:"Electronics", image:"https://via.placeholder.com/300x180?text=Laptop"},
  {title:"T-Shirt", description:"Comfortable cotton t-shirt", price:25, discount:5, category:"Fashion", image:"https://via.placeholder.com/300x180?text=T-Shirt"},
  {title:"Sofa", description:"Luxury 3-seater sofa", price:500, discount:70, category:"Home", image:"https://via.placeholder.com/300x180?text=Sofa"}
];

const itemGrid = document.getElementById('itemGrid');
const lightbox = document.getElementById('lightbox');
const lightboxImg = lightbox.querySelector('img');

// Render Items
function renderItems(category="All") {
  itemGrid.innerHTML = '';
  items.forEach(item => {
    if(category === "All" || item.category === category) {
      const card = document.createElement('div');
      card.className = 'item-card show';
      card.innerHTML = `
        <img src="${item.image}" alt="${item.title}">
        <div class="content">
          <h3>${item.title}</h3>
          <p>${item.description}</p>
          <span class="price">$${item.price}</span> <span class="discount">$${item.discount} off</span>
        </div>
      `;
      // Click image to show in lightbox
      card.querySelector('img').addEventListener('click',()=> {
        lightbox.style.display='flex';
        lightboxImg.src = item.image;
      });
      itemGrid.appendChild(card);
    }
  });
}

// Lightbox close
lightbox.addEventListener('click',()=>{lightbox.style.display='none';});

// Category Tabs
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    renderItems(tab.dataset.category);
  });
});

// Initial render
renderItems();
</script>

</body>
</html>
